<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Availability Grid</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main>
    <h1>Weekly Team Availability</h1>
    <p>Select a slot to see how many team members are free to meet.</p>

    <table>
      <thead>
        <tr>
          <th class="time-header">Time</th>
          <th>Monday</th>
          <th>Tuesday</th>
          <th>Wednesday</th>
          <th>Thursday</th>
          <th>Friday</th>
        </tr>
      </thead>
      <tbody>
        <tr class="sharp">
          <th class="time">09:00 AM</th>
          <td class="available-5"></td>
          <td class="available-4"></td>
          <td class="available-5"></td>
          <td class="available-2"></td>
          <td class="available-1"></td>
        </tr>
        <tr class="half">
          <th class="time">10:00 AM</th>
          <td class="available-3"></td>
          <td class="available-3"></td>
          <td class="available-4"></td>
          <td class="available-5"></td>
          <td class="available-0"></td>
        </tr>
        <tr class="sharp">
          <th class="time">11:00 AM</th>
          <td class="available-2"></td>
          <td class="available-5"></td>
          <td class="available-1"></td>
          <td class="available-3"></td>
          <td class="available-2"></td>
        </tr>
        <tr class="half">
          <th class="time">12:00 PM</th>
          <td class="available-0"></td>
          <td class="available-1"></td>
          <td class="available-2"></td>
          <td class="available-1"></td>
          <td class="available-4"></td>
        </tr>
        <tr class="sharp">
          <th class="time">01:00 PM</th>
          <td class="available-4"></td>
          <td class="available-4"></td>
          <td class="available-5"></td>
          <td class="available-4"></td>
          <td class="available-3"></td>
        </tr>
      </tbody>
    </table>

    <div id="legend">
      <span>Availability</span>
      <div id="legend-gradient"></div>
      <div class="legend-labels">
        <span>0 Empty</span>
        <span>5 Full</span>
      </div>
    </div>
  </main>

</body>
</html>
