<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Blog Post Card</title>
    <link rel="stylesheet" href="styles.css"/>
  </head>
  <body>

    <div class="blog-post-card">

      <img
        class="post-img"
        src="https://cdn.freecodecamp.org/curriculum/labs/cover-photo.jpg"
        alt="Blog post cover photo"
      />

      <div class="post-content">
        <h2 class="post-title">My Journey into Web Development</h2>
        <p class="post-excerpt">
          From knowing nothing about coding to building real projects
          in just a few weeks. Here is my story of how I started
          learning Full Stack Web Development from scratch.
        </p>
        <a class="read-more" href="#">Read More</a>
      </div>

    </div>

  </body>
</html>
