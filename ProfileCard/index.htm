<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>
  <link rel="stylesheet" href="styles.css">
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class = "profile-card">
    <div class = "card-header">
      <div class = "profile-img-container">
        <img src="profile.jpg" alt="John Doe" class="profile-img">
      </div>
    </div>

    <div class="card-body">
      <h2 class="name">John Doe</h2>
      <p class="title">Web Developer</p>

      <div class="social-links">
        <a href="#" class="icon facebook"><i class="fab fa-facebook-f"></i></a>
        <a href="#" class="icon twitter"><i class="fab fa-twitter"></i></a>
        <a href="#" class="icon instagram"><i class="fab fa-instagram"></i></a>
        <a href="#" class="icon youtube"><i class="fab fa-youtube"></i></a>
      </div>

      <div class="action-buttons">
        <button class="btn">Subscribe</button>
        <button class="btn">Message</button>
      </div>

      <div class="stats">
        <div class="stat-item"><i class="far fa-heart"></i> 60k</div>
        <div class="stat-item"><i class="far fa-comment"></i> 20k</div>
        <div class="stat-item"><i class="fas fa-share-node"></i> 12k</div>
      </div>
    </div>
  </div>

</body>
</html>
